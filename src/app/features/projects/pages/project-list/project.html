<div class="min-h-screen bg-background p-4">

  <!-- Header -->
  <div class="mb-5 flex items-start justify-between">

    <div>
      <h1 class="text-[16px] font-semibold text-primary-dark">
        Projects
      </h1>

      <p class="mt-1 text-[8px] text-secondary-dark">
        Manage and curate your projects
      </p>
    </div>

    <button
      type="button"
      class="cursor-pointer h-6 bg-primary-dark px-4 text-[8px] font-medium text-white
             transition hover:bg-primary-container"
      routerLink="/project/addproject"
    >
      Create New Project
    </button>

  </div>

  <!-- Projects Grid -->
  <div
    class="grid grid-cols-1 gap-3
           sm:grid-cols-2
           lg:grid-cols-3"
  >

    @for (project of projects; track project.name) {
      <app-project-card
        [project]="project"
      />
    }

    <!-- Add Project -->
    <app-add-project-card
     
    />

  </div>

</div>
