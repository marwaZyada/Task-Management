<div class="flex flex-col h-screen ">
<div class=" pb-8 ">
   
<app-taskly />

</div>

<div class="sidebaritems">

  <div class="flex flex-col gap-1 flex-grow-1">

    @for (item of sidebarItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-white text-primary-dark shadow-[0px 1px 2px 0px #0000000D]"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex w-[200px] items-center gap-3 px-3 py-[10px] rounded-1 mb-1
         hover:bg-white hover:text-primary-dark
         hover:shadow-[0px_1px_2px_0px_#0000000D]
         transition-all duration-200"
        
      >
        <img [src]="'assets/' + item.image" alt="ii"/>
        <span class="font-medium text-[14px] leading-[20px] ">{{ item.label }}</span>
      </a>
    }

  </div>

</div>

<div class="mt-auto border-t pt-6 border-[#C3C6D633] text--secondary-dark text-sm font-medium leading-5">
    <div class="px-3 py-[10px] flex gap-3 mb-1">
        <img src="../../../assets/collapse.svg" width="11.7" height="20" alt=""/>
        <p>Collapse</p>
    </div>
    <div class="px-3 py-[10px] flex gap-3">
        <img src="../../../assets/logout.svg" width="18" height="18" alt=""/>
        <p>Logout</p>
    </div>
</div>

</div>
